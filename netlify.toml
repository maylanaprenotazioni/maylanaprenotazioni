[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[dev]
  framework = "vite"
  targetPort = 5173
  port = 8888

[[redirects]]
  from = "/"
  to = "/prenota"
  status = 302

# Le API sono Netlify Functions con "path" nel codice (netlify/functions/*.ts):
# vengono eseguite prima di queste regole. Un /api/... inesistente riceve 404 JSON
# invece della pagina dell'app (regola posta PRIMA del fallback SPA).
[[redirects]]
  from = "/api/*"
  to = "/api-404.json"
  status = 404

# SPA: /prenota, /gestisci e /admin servite da index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Link di recupero password: il codice nell'URL non deve finire nel Referer
[[headers]]
  for = "/admin/reset-password*"
  [headers.values]
    Referrer-Policy = "no-referrer"

# Service worker: sempre la versione più recente
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# Link personale cliente: mai indicizzato, mai in cache condivise
[[headers]]
  for = "/gestisci*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
